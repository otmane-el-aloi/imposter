name: Release & Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v1.0.0)'
        required: false
        default: 'v-test'

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Standalone (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: imposter-party-linux-x86_64
            binary_src: dist/imposter-party
          - os: macos-latest
            artifact_name: imposter-party-macos
            binary_src: dist/imposter-party

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install backend dependencies (including dev / PyInstaller)
        run: poetry install --no-interaction

      - name: Install and build frontend
        working-directory: client
        run: |
          npm install
          npm run build

      - name: Build standalone executable with PyInstaller
        run: |
          mkdir -p .pyinstaller_cache
          PYINSTALLER_CONFIG_DIR="$PWD/.pyinstaller_cache" poetry run pyinstaller --noconfirm --onefile \
            --name imposter-party \
            --add-data "client/dist:client/dist" \
            --add-data "backend/words:backend/words" \
            --hidden-import "uvicorn.logging" \
            --hidden-import "uvicorn.loops" \
            --hidden-import "uvicorn.loops.auto" \
            --hidden-import "uvicorn.protocols" \
            --hidden-import "uvicorn.protocols.http" \
            --hidden-import "uvicorn.protocols.http.auto" \
            --hidden-import "uvicorn.protocols.websockets" \
            --hidden-import "uvicorn.protocols.websockets.auto" \
            backend/main.py

      - name: Rename artifact
        run: |
          mv ${{ matrix.binary_src }} ${{ matrix.artifact_name }}
          chmod +x ${{ matrix.artifact_name }}

      - name: Upload artifact to job
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  publish-release:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-binaries

      - name: Flatten release binaries directory
        run: |
          mkdir -p assets-to-upload
          find release-binaries -type f -exec mv {} assets-to-upload/ \;
          ls -la assets-to-upload

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: assets-to-upload/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
