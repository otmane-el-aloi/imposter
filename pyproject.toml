[tool.poetry]
name = "imposter-party-game"
version = "0.1.0"
description = "Local multiplayer imposter party game with FastAPI and React"
authors = ["User"]
readme = "README.md"
packages = [{ include = "backend" }]

[tool.poetry.dependencies]
python = ">=3.9,<3.16"
fastapi = ">=0.110.0"
uvicorn = { extras = ["standard"], version = ">=0.28.0" }
pydantic = ">=2.6.0"
qrcode = ">=7.4.2"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pyinstaller (>=6.22.3,<7.0.0)"
]
